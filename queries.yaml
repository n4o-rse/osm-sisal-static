# Example queries of osm-sisal-static (PRIMER.md, S6): first the questions the version history answers, then the generic ones
# of wikibase-static (copied unchanged from its queries.default.yaml; this file replaces the default set, it does not extend it).
# @@lang@@ is replaced by the default language of the site. Every query that stays must return at least one row, or the build fails.
# Prefixes: oss: the items, ossp:/ossps:/osspq: statement, value and qualifier of a property, osst: the direct claim. P101 version,
# P102 version number, P103 timestamp (text, ISO 8601 UTC, so it sorts and compares as text), P105 user, P107 in the selection since,
# P109 selection, P110 coordinate, P111 geometry history (WKT), P113 OSM tag (`key=value`).
page:
  title: {en: Query the data, de: Daten abfragen}
  intro:
    en: >-
      The data of this site is a Turtle file in the RDF model of Wikibase. The first queries use the OpenStreetMap version history
      (one statement per version, with number, time, changeset and user); the others fit every Wikibase. Edit a query and press Run.
    de: >-
      Die Daten dieser Seite liegen als Turtle-Datei im RDF-Modell von Wikibase vor. Die ersten Abfragen nutzen den Versionsverlauf aus
      OpenStreetMap (ein Statement je Version, mit Nummer, Zeit, Changeset und Benutzer); die übrigen passen zu jeder Wikibase.
      Abfrage ändern, dann auf Ausführen klicken.

queries:
  - id: osm-versions
    title: {en: "Versions per element", de: "Versionen je Element"}
    intro:
      en: How often each OpenStreetMap element was edited, with the first and the last edit.
      de: Wie oft jedes OpenStreetMap-Element bearbeitet wurde, mit der ersten und der letzten Bearbeitung.
    sparql: |
      SELECT ?item ?label (COUNT(?statement) AS ?versions) (MIN(?timestamp) AS ?first) (MAX(?timestamp) AS ?last) WHERE {
        ?item ossp:P101 ?statement ;
              rdfs:label ?label .
        ?statement osspq:P103 ?timestamp .
        FILTER(LANG(?label) = "@@lang@@")
      }
      GROUP BY ?item ?label
      ORDER BY DESC(?versions) ?label ?item
      LIMIT 100

  - id: osm-entry-version
    title: {en: "Elements by the version that put them in the selection", de: "Elemente nach der Version, mit der sie in die Auswahl kamen"}
    intro:
      en: The first version of each element that met the tag condition of the selection (here the tag condition of cave entrances (natural=cave_entrance)), and when it was made.
      de: Die erste Version jedes Elements, die die Tag-Bedingung der Auswahl erfüllte (hier die Tag-Bedingung von Höhleneingänge (natural=cave_entrance)), und wann sie entstand.
    sparql: |
      SELECT ?item ?label ?entryVersion ?since ?selection WHERE {
        ?item ossp:P107 ?entry ;
              ossp:P101 ?version ;
              rdfs:label ?label .
        ?entry ossps:P107 ?url ;
               osspq:P109 ?selection .
        ?version ossps:P101 ?url ;
                 osspq:P102 ?entryVersion ;
                 osspq:P103 ?since .
        FILTER(LANG(?label) = "@@lang@@")
      }
      ORDER BY DESC(?entryVersion) ?since ?label
      LIMIT 200

  - id: osm-changed-since
    title: {en: "Elements changed since a date", de: "Elemente, die seit einem Datum geändert wurden"}
    intro:
      en: Elements whose latest version is not older than the date in the FILTER (change it; times are text in ISO 8601, UTC).
      de: Elemente, deren letzte Version nicht älter ist als das Datum im FILTER (ändern; Zeiten sind Text in ISO 8601, UTC).
    sparql: |
      SELECT ?item ?label ?number ?timestamp ?user WHERE {
        ?item ossp:P101 ?version ;
              rdfs:label ?label .
        ?version wikibase:rank wikibase:PreferredRank ;
                 osspq:P102 ?number ;
                 osspq:P103 ?timestamp ;
                 osspq:P105 ?user .
        FILTER(LANG(?label) = "@@lang@@")
        FILTER(?timestamp >= "2025-01-01T00:00:00Z")
      }
      ORDER BY DESC(?timestamp) ?label ?item
      LIMIT 200

  - id: osm-top-users
    title: {en: "Users with the most versions", de: "Benutzer mit den meisten Versionen"}
    intro:
      en: Who made the versions in this data. The user name is public at OpenStreetMap.
      de: Wer die Versionen in diesen Daten angelegt hat. Der Benutzername ist bei OpenStreetMap öffentlich.
    sparql: |
      SELECT ?user (COUNT(?version) AS ?versions) (COUNT(DISTINCT ?item) AS ?elements) WHERE {
        ?item ossp:P101 ?version .
        ?version osspq:P105 ?user .
      }
      GROUP BY ?user
      ORDER BY DESC(?versions) ?user
      LIMIT 20

  - id: osm-geometry-at
    title: {en: "Position at a point in time", de: "Position zu einem Zeitpunkt"}
    intro:
      en: The geometry each element had at the time in the FILTER (the last entry not after it); elements that did not exist yet are left out. Change the time.
      de: Die Geometrie, die jedes Element zu dem Zeitpunkt im FILTER hatte (der letzte Eintrag, der nicht danach liegt); noch nicht vorhandene Elemente fehlen. Zeit ändern.
    sparql: |
      #defaultView:Map
      SELECT ?item ?label ?geometry ?since WHERE {
        ?item ossp:P111 ?entry ;
              rdfs:label ?label .
        ?entry ossps:P111 ?geometry ;
               osspq:P103 ?since .
        FILTER(LANG(?label) = "@@lang@@")
        FILTER(?since <= "2023-01-01T00:00:00Z")
        FILTER NOT EXISTS {
          ?item ossp:P111 ?later .
          ?later osspq:P103 ?laterSince .
          FILTER(?laterSince > ?since && ?laterSince <= "2023-01-01T00:00:00Z")
        }
      }
      ORDER BY ?label ?item
      LIMIT 200

  - id: osm-wikidata
    title: {en: "Elements with a Wikidata item", de: "Elemente mit Wikidata-Item"}
    intro:
      en: >-
        The OSM tag `wikidata` of the last version, shown as the Wikidata item it names. This is the bridge to Wikidata; the RDF export
        itself does not point to it (no owl:sameAs, PRIMER.md A4).
      de: >-
        Der OSM-Tag `wikidata` der letzten Version, als das Wikidata-Item gezeigt, das er nennt. Das ist die Brücke zu Wikidata; der
        RDF-Export selbst verweist nicht darauf (kein owl:sameAs, PRIMER.md A4).
    sparql: |
      SELECT ?item ?label ?wikidata WHERE {
        ?item ossp:P113 ?statement ;
              rdfs:label ?label .
        ?statement ossps:P113 ?tag .
        FILTER(LANG(?label) = "@@lang@@")
        FILTER(STRSTARTS(?tag, "wikidata="))
        BIND(IRI(CONCAT("http://www.wikidata.org/entity/", STRAFTER(?tag, "wikidata="))) AS ?wikidata)
      }
      ORDER BY ?label ?item
      LIMIT 500

  - id: osm-tag
    title: {en: "Elements with a given tag", de: "Elemente mit einem bestimmten Tag"}
    intro:
      en: The elements whose last version carries the tag in the FILTER (cave entrances that are tourist attractions here). Change the text to `key=value`.
      de: Die Elemente, deren letzte Version den Tag im FILTER trägt (hier Höhleneingänge, die Sehenswürdigkeiten sind). Den Text in `key=value` ändern.
    sparql: |
      SELECT ?item ?label ?tag WHERE {
        ?item ossp:P113 ?statement ;
              rdfs:label ?label .
        ?statement ossps:P113 ?tag .
        FILTER(LANG(?label) = "@@lang@@")
        FILTER(?tag = "tourism=attraction")
      }
      ORDER BY ?label ?item
      LIMIT 200

  - id: osm-sisal-sites
    title: {en: "Caves with their SISAL site", de: "Höhlen mit ihrem SISAL-Standort"}
    intro:
      en: >-
        The caves that are linked to a SISAL speleothem site (property P114), with the name of the site, the number of its δ18O samples and the
        distance between site and OSM node in kilometres. The site IRI is the one of the EPICA-SISAL-FAIRification project.
      de: >-
        Die Höhlen, die mit einem SISAL-Speleothem-Standort verknüpft sind (Property P114), mit dem Namen des Standorts, der Zahl seiner
        δ18O-Proben und dem Abstand zwischen Standort und OSM-Node in Kilometern. Die Standort-IRI ist die des Projekts EPICA-SISAL-FAIRification.
    sparql: |
      SELECT ?item ?label ?site ?siteName ?samples ?km WHERE {
        ?item ossp:P114 ?statement ;
              rdfs:label ?label .
        ?statement ossps:P114 ?site ;
                   osspq:P115 ?siteName ;
                   osspq:P116 ?samples ;
                   osspq:P118 ?km .
        FILTER(LANG(?label) = "@@lang@@")
      }
      ORDER BY DESC(?samples) ?label ?item
      LIMIT 200

  - id: osm-sisal-without-site
    title: {en: "Caves without a SISAL site", de: "Höhlen ohne SISAL-Standort"}
    intro:
      en: "The caves of this site that have no SISAL site (yet), because no pair in `data/seeds/sisal-matches.csv` was sure or accepted."
      de: "Die Höhlen dieser Site ohne SISAL-Standort (bisher), weil kein Paar in `data/seeds/sisal-matches.csv` sicher oder bestätigt war."
    sparql: |
      SELECT ?item ?label WHERE {
        ?item rdfs:label ?label ;
              ossp:P100 ?element .
        FILTER(LANG(?label) = "@@lang@@")
        FILTER NOT EXISTS { ?item ossp:P114 ?site }
      }
      ORDER BY ?label ?item
      LIMIT 300

  - id: items
    title: {en: "Items with label and description", de: "Items mit Bezeichnung und Beschreibung"}
    intro:
      en: Every item with its label and, where there is one, its description in the same language.
      de: Jedes Item mit Bezeichnung und, wo vorhanden, Beschreibung in derselben Sprache.
    sparql: |
      SELECT ?item ?label ?description WHERE {
        ?item a wikibase:Item ;
              rdfs:label ?label .
        FILTER(LANG(?label) = "@@lang@@")
        OPTIONAL {
          ?item schema:description ?description .
          FILTER(LANG(?description) = "@@lang@@")
        }
      }
      ORDER BY ?label ?item

  - id: properties
    title: {en: "Properties and their data types", de: "Properties und ihre Datentypen"}
    intro:
      en: The vocabulary of the Wikibase. The data type decides which kind of value a property takes.
      de: Das Vokabular der Wikibase. Der Datentyp bestimmt, welche Art von Wert eine Property hat.
    sparql: |
      SELECT ?property ?label ?datatype WHERE {
        ?property a wikibase:Property ;
                  wikibase:propertyType ?datatype ;
                  rdfs:label ?label .
        FILTER(LANG(?label) = "@@lang@@")
      }
      ORDER BY ?datatype ?label ?property

  - id: statements-per-property
    title: {en: "How often each property is used", de: "Wie oft jede Property verwendet wird"}
    intro:
      en: Statements per property, most used first. Properties without a statement do not appear.
      de: Aussagen pro Property, die meistgenutzte zuerst. Properties ohne Aussage erscheinen nicht.
    sparql: |
      SELECT ?property ?label (COUNT(?statement) AS ?statements) WHERE {
        ?property wikibase:claim ?claim ;
                  rdfs:label ?label .
        FILTER(LANG(?label) = "@@lang@@")
        ?item ?claim ?statement .
      }
      GROUP BY ?property ?label
      ORDER BY DESC(?statements) ?label ?property

  - id: aliases
    requires: [alias]
    title: {en: "Alternative names", de: "Alternative Namen"}
    intro:
      en: Items that are also known under another name ("Also known as").
      de: Items, die auch unter einem anderen Namen bekannt sind („Auch bekannt als“).
    sparql: |
      SELECT ?item ?label ?alias WHERE {
        ?item skos:altLabel ?alias ;
              rdfs:label ?label .
        FILTER(LANG(?label) = "@@lang@@")
      }
      ORDER BY ?label ?alias ?item

  - id: item-links
    requires: [wikibase-item]
    title: {en: "How items are linked", de: "Wie Items verknüpft sind"}
    intro:
      en: Statements whose value is another item, written as subject, property, object.
      de: Aussagen, deren Wert ein anderes Item ist, als Subjekt, Property, Objekt.
    sparql: |
      SELECT ?subjectLabel ?propertyLabel ?objectLabel WHERE {
        ?property wikibase:propertyType wikibase:WikibaseItem ;
                  wikibase:directClaim ?direct ;
                  rdfs:label ?propertyLabel .
        FILTER(LANG(?propertyLabel) = "@@lang@@")
        ?subject ?direct ?object .
        OPTIONAL {
          ?subject rdfs:label ?subjectLabel .
          FILTER(LANG(?subjectLabel) = "@@lang@@")
        }
        OPTIONAL {
          ?object rdfs:label ?objectLabel .
          FILTER(LANG(?objectLabel) = "@@lang@@")
        }
      }
      ORDER BY ?subjectLabel ?propertyLabel ?objectLabel
      LIMIT 200

  - id: most-used-items
    requires: [wikibase-item]
    title: {en: "Items used most often as a value", de: "Items, die am häufigsten als Wert vorkommen"}
    intro:
      en: The twenty items that other items point to most often.
      de: Die zwanzig Items, auf die andere Items am häufigsten verweisen.
    sparql: |
      SELECT ?item ?label (COUNT(?subject) AS ?uses) WHERE {
        ?property wikibase:propertyType wikibase:WikibaseItem ;
                  wikibase:directClaim ?direct .
        ?subject ?direct ?item .
        ?item rdfs:label ?label .
        FILTER(LANG(?label) = "@@lang@@")
      }
      GROUP BY ?item ?label
      ORDER BY DESC(?uses) ?label ?item
      LIMIT 20

  - id: coordinates
    requires: [globe-coordinate]
    title: {en: "Items with coordinates", de: "Items mit Koordinaten"}
    intro:
      en: Globe coordinates as WKT, the form GeoSPARQL tools expect (longitude first).
      de: Geokoordinaten als WKT, der Form, die GeoSPARQL-Werkzeuge erwarten (Länge zuerst).
    sparql: |
      #defaultView:Map
      SELECT ?item ?label ?coordinates WHERE {
        ?property wikibase:propertyType wikibase:GlobeCoordinate ;
                  wikibase:directClaim ?direct .
        ?item ?direct ?coordinates ;
              rdfs:label ?label .
        FILTER(LANG(?label) = "@@lang@@")
      }
      ORDER BY ?label ?item
      LIMIT 200

  - id: images
    requires: [image]
    title: {en: "Items with an image", de: "Items mit Bild"}
    intro:
      en: >-
        Image files, from Commons files and from URLs that end in .jpg, .png and the like, shown as pictures in the
        query editor (the line starting with # chooses the view).
      de: >-
        Bilddateien, aus Commons-Dateien und aus URLs, die auf .jpg, .png und ähnlich enden, im Abfrage-Editor als Bilder
        gezeigt (die Zeile mit # wählt die Ansicht).
    sparql: |
      #defaultView:ImageGrid
      SELECT ?item ?label ?image WHERE {
        ?property wikibase:directClaim ?direct .
        ?item ?direct ?image .
        FILTER(isIRI(?image) && REGEX(STR(?image), "\\.(jpe?g|png|gif|svg|webp|tiff?)$", "i"))
        OPTIONAL {
          ?item rdfs:label ?label .
          FILTER(LANG(?label) = "@@lang@@")
        }
      }
      ORDER BY ?label ?item
      LIMIT 200

  - id: qualifiers
    requires: [qualifier]
    title: {en: "Statements with qualifiers", de: "Aussagen mit Qualifiern"}
    intro:
      en: A statement can carry qualifiers that narrow it down. This lists the qualifier properties in use.
      de: Eine Aussage kann Qualifier tragen, die sie eingrenzen. Hier stehen die verwendeten Qualifier-Properties.
    sparql: |
      SELECT ?qualifierLabel (COUNT(?statement) AS ?statements) WHERE {
        ?qualifierProperty wikibase:qualifier ?qualifier ;
                           rdfs:label ?qualifierLabel .
        FILTER(LANG(?qualifierLabel) = "@@lang@@")
        ?statement ?qualifier ?value .
      }
      GROUP BY ?qualifierLabel
      ORDER BY DESC(?statements) ?qualifierLabel

  - id: references
    requires: [reference]
    title: {en: "Statements with a reference", de: "Aussagen mit Fundstelle"}
    intro:
      en: Statements that say where they come from, with the property and value of the reference.
      de: Aussagen, die angeben, woher sie stammen, mit Property und Wert der Fundstelle.
    sparql: |
      SELECT ?itemLabel ?propertyLabel ?sourceLabel ?source WHERE {
        # Two groups, not three. rdflib joins a group lazily (one solution at a time) only when it has no further
        # join inside it; each additional group is evaluated alone and then paired with every row of the others.
        # The first group finds the statements and their references; the second looks the two properties up
        # for the bound ?claim and ?referenceProperty.
        { ?item ?claim ?statement .
          ?statement prov:wasDerivedFrom ?reference .
          ?reference ?referenceProperty ?source . }
        { ?property wikibase:claim ?claim ;
                    rdfs:label ?propertyLabel .
          ?sourceProperty wikibase:reference ?referenceProperty ;
                          rdfs:label ?sourceLabel .
          FILTER(LANG(?propertyLabel) = "@@lang@@")
          FILTER(LANG(?sourceLabel) = "@@lang@@") }
        OPTIONAL {
          ?item rdfs:label ?itemLabel .
          FILTER(LANG(?itemLabel) = "@@lang@@")
        }
      }
      ORDER BY ?itemLabel ?propertyLabel ?sourceLabel ?source
      LIMIT 200

  - id: preferred-rank
    requires: [preferred]
    title: {en: "Statements with preferred rank", de: "Aussagen mit bevorzugtem Rang"}
    intro:
      en: Where a property has several statements, the preferred one is the one the direct property returns.
      de: Hat eine Property mehrere Aussagen, ist die bevorzugte die, die die direkte Property liefert.
    sparql: |
      SELECT ?itemLabel ?propertyLabel ?statement WHERE {
        ?statement wikibase:rank wikibase:PreferredRank .
        ?property wikibase:claim ?claim ;
                  rdfs:label ?propertyLabel .
        FILTER(LANG(?propertyLabel) = "@@lang@@")
        ?item ?claim ?statement .
        OPTIONAL {
          ?item rdfs:label ?itemLabel .
          FILTER(LANG(?itemLabel) = "@@lang@@")
        }
      }
      ORDER BY ?itemLabel ?propertyLabel ?statement

  - id: catalogues
    title: {en: "The catalogues of this export (DCAT)", de: "Die Kataloge dieses Exports (DCAT)"}
    intro:
      en: The export describes itself with DCAT 3. This lists the catalogues and how many datasets each holds.
      de: Der Export beschreibt sich selbst mit DCAT 3. Hier stehen die Kataloge und wie viele Datasets jeder enthält.
    sparql: |
      SELECT ?catalog ?title (COUNT(?dataset) AS ?datasets) WHERE {
        ?catalog a dcat:Catalog ;
                 dcterms:title ?title ;
                 dcat:dataset ?dataset .
      }
      GROUP BY ?catalog ?title
      ORDER BY DESC(?datasets) ?catalog

  - id: distributions
    requires: [distribution]
    title: {en: "Where to download each record (DCAT)", de: "Wo sich jeder Datensatz herunterladen lässt (DCAT)"}
    intro:
      en: Every entity is a dataset with a JSON, a Turtle and an HTML distribution. This lists the Turtle files.
      de: Jede Entität ist ein Dataset mit einer JSON-, einer Turtle- und einer HTML-Distribution. Hier stehen die Turtle-Dateien.
    sparql: |
      SELECT ?dataset ?title ?download WHERE {
        ?dataset a dcat:Dataset ;
                 dcterms:title ?title ;
                 dcat:distribution ?distribution .
        FILTER(LANG(?title) = "@@lang@@")
        ?distribution dcat:mediaType <https://www.iana.org/assignments/media-types/text/turtle> ;
                      dcat:downloadURL ?download .
      }
      ORDER BY ?title ?dataset
      LIMIT 100

  - id: crm-classes
    requires: [crm]
    title: {en: "Classes and their CIDOC CRM class", de: "Klassen und ihre CIDOC-CRM-Klasse"}
    intro:
      en: The classes that say themselves which class of the CIDOC CRM (or one of its extensions) they are subclasses of; the classes below them inherit it.
      de: Die Klassen, die selbst sagen, Unterklasse welcher Klasse des CIDOC CRM (oder einer Erweiterung) sie sind; die Klassen darunter erben sie.
    sparql: |
      SELECT ?class ?label ?crmClass WHERE {
        ?class rdfs:subClassOf ?crmClass ;
               rdfs:label ?label .
        FILTER(STRSTARTS(STR(?crmClass), "http://www.cidoc-crm.org/"))
        FILTER(LANG(?label) = "@@lang@@")
      }
      ORDER BY ?label ?crmClass
